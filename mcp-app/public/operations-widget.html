<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operações Sentinel</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --bg:#f4f7fb;--surface:#fff;--soft:#edf2f7;--text:#172033;--muted:#667085;--line:#dbe3ed;
        --ok:#16865b;--run:#2777d4;--fail:#d33f49;--miss:#b86f00;--wait:#697386;
      }
      @media(prefers-color-scheme:dark){:root{--bg:#10151f;--surface:#171e2b;--soft:#202a39;--text:#edf2f7;--muted:#aab6c7;--line:#344054}}
      *{box-sizing:border-box} body{margin:0;padding:16px;background:var(--bg);color:var(--text)} main{max-width:980px;margin:auto}
      header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px} h1{font-size:1.2rem;margin:0} h2{font-size:.92rem;margin:18px 0 8px}.muted{color:var(--muted);font-size:.74rem}
      button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--surface);color:var(--text);cursor:pointer}button:disabled{opacity:.55}
      .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}.metric,.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}.metric strong{display:block;font-size:1.3rem}.metric span{font-size:.7rem;color:var(--muted)}
      .grid{display:grid;grid-template-columns:1fr 1.3fr;gap:12px}.queue{display:grid;gap:7px}.attention{border-left:4px solid var(--miss);background:var(--soft);border-radius:9px;padding:9px}.attention.critical{border-color:var(--fail)}.attention strong{font-size:.8rem}.attention p{margin:3px 0 0;font-size:.72rem;color:var(--muted)}
      .bars{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:84px 1fr 38px;gap:8px;align-items:center;font-size:.72rem}.track{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--wait)}.fill.SUCCESS{background:var(--ok)}.fill.FAILED,.fill.TIMEOUT{background:var(--fail)}.fill.MISSED{background:var(--miss)}.fill.RUNNING{background:var(--run)}
      .timeline{position:relative;display:grid;gap:7px}.event{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:start;font-size:.75rem}.dot{width:9px;height:9px;margin-top:4px;border-radius:50%;background:var(--wait)}.event.SUCCESS .dot{background:var(--ok)}.event.FAILED .dot,.event.TIMEOUT .dot{background:var(--fail)}.event.MISSED .dot{background:var(--miss)}.event.RUNNING .dot{background:var(--run)}.event small{color:var(--muted)}
      details{margin-top:5px}summary{cursor:pointer;color:var(--fail);font-size:.7rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--soft);padding:8px;border-radius:8px;font-size:.68rem}.empty{padding:14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px}
      @media(max-width:700px){body{padding:11px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.bar-row{grid-template-columns:72px 1fr 32px}}
    </style>
  </head>
  <body>
    <main>
      <header><div><h1>Operações Sentinel</h1><div id="updated" class="muted">Aguardando dados...</div></div><button id="refresh">Atualizar</button></header>
      <section id="metrics" class="metrics"></section>
      <div class="grid">
        <section><h2>Fila de atenção</h2><div id="queue" class="panel queue"></div></section>
        <section><h2>Distribuição - 7 dias</h2><div id="bars" class="panel bars"></div></section>
      </div>
      <h2>Linha do tempo recente</h2><section id="timeline" class="panel timeline"></section>
    </main>
    <script type="module">
      const metricsEl=document.querySelector("#metrics"),queueEl=document.querySelector("#queue"),barsEl=document.querySelector("#bars"),timelineEl=document.querySelector("#timeline"),updatedEl=document.querySelector("#updated"),refreshEl=document.querySelector("#refresh");
      const labels={SUCCESS:"Sucesso",FAILED:"Falha",TIMEOUT:"Timeout",MISSED:"Ausência",RUNNING:"Executando",PENDING:"Aguardando"};
      let data={metrics:{statusCounts:{}},attentionQueue:[],executions:[]},rpcId=0;const pending=new Map();
      const el=(tag,value,className)=>{const node=document.createElement(tag);node.textContent=value??"—";if(className)node.className=className;return node};
      const date=value=>{if(!value)return"—";const parsed=new Date(value);return Number.isNaN(parsed.valueOf())?value:new Intl.DateTimeFormat(document.documentElement.lang||"pt-BR",{dateStyle:"short",timeStyle:"short"}).format(parsed)};
      function render(){
        const m=data.metrics??{};const cards=[["Sucesso",`${m.successRate??0}%`],["Ausência",`${m.absenceRate??0}%`],["Duração média",m.averageDurationSeconds==null?"—":`${m.averageDurationSeconds}s`],["P95",m.p95DurationSeconds==null?"—":`${m.p95DurationSeconds}s`],["Violações",m.durationViolations??0]];
        metricsEl.replaceChildren(...cards.map(([label,value])=>{const card=el("div",null,"metric");card.append(el("strong",value),el("span",label));return card}));
        updatedEl.textContent=data.generatedAt?`Atualizado em ${date(data.generatedAt)}`:"Aguardando dados...";
        const queue=data.attentionQueue??[];queueEl.replaceChildren(...(queue.length?queue.map(item=>{const card=el("article",null,`attention ${item.severity}`);card.append(el("strong",`${item.score} - ${item.name}`),el("p",item.reason));return card}):[el("div","Nenhuma automação exige atenção.","empty")]));
        const counts=m.statusCounts??{};const max=Math.max(1,...Object.values(counts));barsEl.replaceChildren(...["SUCCESS","FAILED","TIMEOUT","MISSED","RUNNING"].map(status=>{const row=el("div",null,"bar-row"),track=el("div",null,"track"),fill=el("div",null,`fill ${status}`);fill.style.width=`${((counts[status]??0)/max)*100}%`;track.append(fill);row.append(el("span",labels[status]),track,el("strong",counts[status]??0));return row}));
        const executions=(data.executions??[]).slice(0,30);timelineEl.replaceChildren(...(executions.length?executions.map(item=>{const row=el("article",null,`event ${item.status}`),body=el("div");body.append(el("strong",`${item.jobId} - ${labels[item.status]??item.status}`),el("div",`Duração: ${item.durationSeconds??"—"}s`,"muted"));if(item.errorMessage||item.traceback){const details=document.createElement("details"),summary=el("summary","Ver diagnóstico");details.append(summary);if(item.errorMessage)details.append(el("div",item.errorMessage,"muted"));if(item.traceback)details.append(el("pre",item.traceback));body.append(details)}row.append(el("span","","dot"),body,el("small",date(item.startedAt)));return row}):[el("div","Sem execuções no período.","empty")]));
      }
      const update=response=>{if(response?.structuredContent?.metrics){data=response.structuredContent;render()}};
      const notify=(method,params)=>window.parent.postMessage({jsonrpc:"2.0",method,params},"*");
      const request=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")});
      window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(typeof message.id==="number"){const p=pending.get(message.id);if(!p)return;pending.delete(message.id);message.error?p.reject(message.error):p.resolve(message.result);return}if(message.method==="ui/notifications/tool-result")update(message.params)},{passive:true});
      const ready=(async()=>{await request("ui/initialize",{appInfo:{name:"sentinel-operations-widget",version:"0.2.0"},appCapabilities:{},protocolVersion:"2026-01-26"});notify("ui/notifications/initialized",{})})();
      async function refresh(){refreshEl.disabled=true;try{await ready;update(await request("tools/call",{name:"sentinel_render_operations",arguments:{}}))}catch(error){updatedEl.textContent=`Falha ao atualizar: ${error?.message??"erro desconhecido"}`}finally{refreshEl.disabled=false}}
      refreshEl.addEventListener("click",refresh);setInterval(()=>void refresh(),60000);render();
    </script>
  </body>
</html>
